        setSelectedReport(report);
        setActiveTab('overview');
        setCurrentScreen('DASHBOARD');
      };

      const handlePlayerClick = (playerId) => {
        setSelectedPlayerId(playerId);
        setCurrentScreen('PLAYER_DETAIL');
      };

      // Dashboard Data (선택된 학년과 일자에 맞는 선수 필터링)
      const dashboardData = useMemo(() => {
        if (!selectedReport) return [];
        return GLOBAL_DATA.filter(p => 
          p.team === loginTeam && 
          p.grade === selectedReport.grade && 
          p.testDateCode === selectedReport.dateCode
        );
      }, [loginTeam, selectedReport]);

      // 팀 평균 계산
      const teamStats = useMemo(() => {
        if (!dashboardData.length) return null;
        
        const avg = (keyFn) => Number((dashboardData.reduce((sum, p) => sum + keyFn(p), 0) / dashboardData.length).toFixed(1));
        const avg3 = (keyFn) => Number((dashboardData.reduce((sum, p) => sum + keyFn(p), 0) / dashboardData.length).toFixed(3));
        
        const riskPlayers = dashboardData.filter(p => 
          p.physical.riskLevel.redSRisk === '위험' || 
          p.physical.riskLevel.phyLoadRisk === '위험' || 
          p.physical.riskLevel.fatigueRisk === '위험'
        );

        // 산점도 겹침 방지 (Y축 위치 분산 알고리즘)
        const sortedDashboardData = [...dashboardData].sort((a,b) => a.growth.boneAgeDecimal - b.growth.boneAgeDecimal);
        const scatterData = sortedDashboardData.map((p, i, arr) => {
          const sameX = arr.filter(other => other.growth.boneAgeDecimal === p.growth.boneAgeDecimal);
          const yPosIndex = sameX.findIndex(other => other.playerId === p.playerId);
          const total = sameX.length;
          const spacing = 1.2;
          const startY = 3 - ((total - 1) * spacing) / 2;
          const yPos = startY + yPosIndex * spacing;

          return {
            name: p.name,
            boneAgeDecimal: p.growth.boneAgeDecimal,
            yPos: yPos,
            boneAgeText: `${p.growth.boneAgeYear}년 ${p.growth.boneAgeMonth}월`
          };
        });

        return {
          mental: {
            mgi: avg(p => p.mental.mgi),
            tension: avg(p => p.mental.tension),
            support: avg(p => p.mental.support),
            prep: avg(p => p.mental.prep),
            recovery: avg(p => p.mental.recovery),
            focus: avg(p => p.mental.focus),
            stability: avg(p => p.mental.stability)
          },
          physical: {
            weight: avg(p => p.weight),
            fat: avg(p => p.physical.fat),
            ecw: avg3(p => p.physical.ecw),
            sdnn: avg(p => p.physical.hrv.sdnn),
            rmssd: avg(p => p.physical.hrv.rmssd),
            lf: avg(p => p.physical.hrv.lf),
            hf: avg(p => p.physical.hrv.hf),
            stress: avg(p => p.physical.hrv.stress)
          },
          growth: {
            height: avg(p => p.height),
            avgBoneAge: avg(p => p.growth.boneAgeDecimal), 
            pah: avg(p => p.growth.pah),
            scatterData: scatterData
          },
          physicalRiskPlayers: riskPlayers
        };
      }, [dashboardData]);

      // 정렬 로직
      const handleSort = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
        setSortConfig({ key, direction });
      };
      
      const getNestedValue = (obj, path) => path.split('.').reduce((acc, part) => acc && acc[part], obj);
      
      const processedData = useMemo(() => {
        const sorted = [...dashboardData].sort((a, b) => {
          const aValue = getNestedValue(a, sortConfig.key);
          const bValue = getNestedValue(b, sortConfig.key);
          if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
          if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
          return 0;
        });
        return sorted;
      }, [dashboardData, sortConfig]);

      const playerHistoryData = useMemo(() => {
        if (!selectedPlayerId) return [];
        return GLOBAL_DATA.filter(p => p.playerId === selectedPlayerId)
          .sort((a, b) => a.testDateCode.localeCompare(b.testDateCode));
      }, [selectedPlayerId]);
      
      const currentPlayer = playerHistoryData[playerHistoryData.length - 1];

      // 개인 상세페이지 전용 레이다 차트 데이터 계산 (선수 vs 팀평균)
      const playerRadarData = useMemo(() => {
        if (!currentPlayer || !teamStats) return [];
        return [
          { subject: '수행불안(경기긴장)', player: currentPlayer.mental.tension, teamAvg: teamStats.mental.tension },
          { subject: '사회적지지(주변도움활용)', player: currentPlayer.mental.support, teamAvg: teamStats.mental.support },
          { subject: '경기준비능력(위닝멘탈리티)', player: currentPlayer.mental.prep, teamAvg: teamStats.mental.prep },
          { subject: '실수후 회복력', player: currentPlayer.mental.recovery, teamAvg: teamStats.mental.recovery },
          { subject: '자기조절 집중력', player: currentPlayer.mental.focus, teamAvg: teamStats.mental.focus },
          { subject: '경기 안정성', player: currentPlayer.mental.stability, teamAvg: teamStats.mental.stability }
        ];
      }, [currentPlayer, teamStats]);

      // 유틸 (점수 색상표)
      const getScoreColor = (score) => {
        if (score >= 4.5) return 'text-[#10b981] font-bold'; 
        if (score >= 3.0) return 'text-[#fbbc04] font-bold'; 
        return 'text-[#e30613] font-bold'; 
      };
      const getEcwColor = (ecw) => {
        if (ecw >= 0.390) return 'text-[#e30613] font-black';
        if (ecw >= 0.386) return 'text-[#d97706] font-bold';
        return 'text-[#10b981] font-bold';
      };

      // 뼈나이 차트 툴팁 (평균 대비 격차 표시 포함)
      const ScatterTooltip = ({ active, payload }) => {
        if (active && payload && payload.length) {
          const data = payload[0].payload;
          const diff = (data.boneAgeDecimal - teamStats.growth.avgBoneAge).toFixed(1);
          const diffText = diff > 0 ? `+${diff}년` : diff < 0 ? `${diff}년` : `0년`;
          const diffColor = diff > 0 ? 'text-[#e30613]' : diff < 0 ? 'text-[#10b981]' : 'text-slate-300';
          
          return (
            <div className="bg-[#0b1c2d] text-white p-3 rounded-lg shadow-xl border border-slate-700 z-[100]">
              <p className="font-black text-sm mb-1">{data.name}</p>
              <p className="text-xs text-[#fbbc04]">뼈나이: {data.boneAgeText}</p>
              <p className="text-xs text-slate-300 mt-1">
                팀 평균 대비: <span className={`font-bold ${diffColor}`}>{diffText}</span>
              </p>
            </div>
          );
        }
        return null;
      };

      // ==========================================
      // RENDER: LOGIN SCREEN
      // ==========================================
      if (currentScreen === 'LOGIN') {

                  <Trophy className="w-10 h-10 text-white" />
                </div>

              <form onSubmit={handleLogin} className="bg-white/10 backdrop-blur-xl p-8 rounded-3xl border border-white/10 shadow-2xl">

                    <select

                      value={loginTeam}

                  </div>
                </div>

                <div className="mb-8">
                  <label className="block text-slate-300 text-xs font-bold mb-2 uppercase tracking-wider">액세스 코드</label>

                    <Lock className="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" />
                    <input 
                      type="password"

                      value={password}

                  {loginError && <p className="text-[#e30613] text-xs font-bold mt-2 flex items-center"><AlertCircle className="w-3 h-3 mr-1" />{loginError}</p>}
                </div>

                <button 
                  type="submit" 
                  className="w-full bg-gradient-to-r from-[#e30613] to-[#c7000e] hover:from-[#c7000e] hover:to-[#a0000a] text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-[#e30613]/30 flex items-center justify-center uppercase tracking-widest text-sm"
                >
                  로그인 <ChevronRight className="w-4 h-4 ml-2" />
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ==========================================
      // RENDER: SELECTION SCREEN
      // ==========================================
      if (currentScreen === 'SELECTION') {
        return (
          <div className="min-h-screen bg-[#f1f5f9] flex flex-col">
            <header className="bg-[#0b1c2d] text-white h-16 flex items-center justify-between px-8 shadow-md">
              <div className="flex items-center gap-3">
                <Trophy className="w-6 h-6 text-[#fbbc04]" />
                <h1 className="text-xl font-black tracking-widest uppercase">MPS PRO <span className="text-slate-500 mx-2">|</span> {loginTeam}</h1>
              </div>
              <button onClick={() => setCurrentScreen('LOGIN')} className="text-sm font-semibold text-slate-400 hover:text-white transition-colors">로그아웃</button>
            </header>

            <main className="flex-1 p-8 md:p-12 max-w-7xl mx-auto w-full flex items-center justify-center flex-col">
              <div className="mb-10 text-center">
                <h2 className="text-3xl font-black text-[#0b1c2d] mb-2">주기화 검진 리포트 열람</h2>
                <p className="text-slate-500 font-medium">현재 진행된 1회차(4월) 리포트를 선택하세요.</p>
              </div>

              {/* 1학년 단독 노출 */}
              <div className="w-full max-w-md">
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full">
                  <div className="bg-[#0b1c2d] p-4 text-center">
                    <h3 className="text-lg font-black text-white">중등부 1학년 (U13)</h3>
                    <p className="text-xs text-[#fbbc04] font-bold">전체 21명 대상 리포트</p>
                  </div>
                  <div className="p-6 space-y-4 flex-1 bg-slate-50">
                    {REPORT_ARCHIVE.grade1.map(report => (
                      <button 
                        key={report.id} onClick={() => handleSelectReport(report)} disabled={report.status !== '완료'}
                        className={`w-full text-left p-5 rounded-xl border-2 transition-all flex items-center justify-between group ${
                          report.status === '완료' ? 'border-transparent bg-white shadow-md hover:border-[#e30613] hover:shadow-lg cursor-pointer' : 'border-slate-200 bg-slate-100 opacity-60 cursor-not-allowed'
                        }`}
                      >
                        <div>
                          <div className="flex items-center gap-2 mb-1.5">
                            <Calendar className={`w-4 h-4 ${report.status === '완료' ? 'text-[#e30613]' : 'text-slate-400'}`} />
                            <span className={`font-black text-lg ${report.status === '완료' ? 'text-[#0b1c2d]' : 'text-slate-500'}`}>{report.dateLabel}</span>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className="text-xs font-bold bg-slate-100 px-2 py-1 rounded text-slate-600">{report.title}</span>
                            <span className="text-xs text-slate-500">{report.center}</span>
                          </div>
                        </div>
                        {report.status === '완료' ? (
                          <div className="w-10 h-10 rounded-full bg-slate-50 group-hover:bg-[#e30613] flex items-center justify-center transition-colors">
                            <ArrowRight className="w-5 h-5 text-slate-400 group-hover:text-white" />
                          </div>
                        ) : <span className="text-xs font-bold text-slate-400 bg-slate-200 px-2 py-1 rounded">예정</span>}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </main>
          </div>
        );
      }

      // ==========================================
      // RENDER: PLAYER DETAIL
      // ==========================================
      if (currentScreen === 'PLAYER_DETAIL' && currentPlayer) {
        return (
          <div className="h-screen bg-[#f1f5f9] flex flex-col overflow-hidden">
            <header className="bg-[#0b1c2d] text-white h-14 flex items-center justify-between px-6 shrink-0 shadow-md">
              <div className="flex items-center gap-4">
                <button onClick={() => setCurrentScreen('DASHBOARD')} className="p-1.5 hover:bg-white/10 rounded-lg transition-colors mr-2">
                  <ArrowLeft className="w-5 h-5 text-slate-300" />
                </button>
                <div className="flex flex-col">
                  <h1 className="text-sm font-black tracking-widest text-white flex items-center">
                    MPS PRO <span className="mx-2 text-slate-600">|</span> <span className="text-[#fbbc04] font-bold">{loginTeam}</span>
                  </h1>
                  <span className="text-[10px] text-slate-400">{currentPlayer.name} 선수의 누적 데이터 추적</span>
                </div>
              </div>
            </header>

            <main className="flex-1 overflow-y-auto p-6 bg-slate-50">
              <div className="max-w-6xl mx-auto space-y-6">
                
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-6">
                  <div className="flex items-center gap-6">
                    <div className="w-20 h-20 bg-[#0b1c2d] text-white rounded-full flex items-center justify-center text-3xl font-black shadow-lg">
                      {currentPlayer.name[0]}
                    </div>
                    <div>
                      <h2 className="text-3xl font-black text-[#0b1c2d] flex items-center">
                        {currentPlayer.name} 
                        <span className="ml-3 text-sm font-bold bg-slate-100 text-slate-600 px-2 py-1 rounded">{currentPlayer.playerId}</span>
                      </h2>
                      <p className="text-slate-500 font-medium mt-1">{currentPlayer.birth} (중등부 {currentPlayer.grade}학년) | 최근 검진: {currentPlayer.testDateCode}</p>
                    </div>
                  </div>
                  <div className="flex gap-4">
                    <div className="bg-[#fbbc04]/10 border border-[#fbbc04]/20 p-3 rounded-xl text-center min-w-[100px]">
                      <p className="text-[10px] text-[#d97706] font-bold uppercase">최근 성장단계</p>
                      <p className="text-lg font-black text-[#0b1c2d] mt-1">{currentPlayer.growth.stage}</p>
                    </div>
                    <div className="bg-blue-50 border border-blue-100 p-3 rounded-xl text-center min-w-[100px]">
                      <p className="text-[10px] text-blue-600 font-bold uppercase">예측 신장</p>
                      <p className="text-lg font-black text-[#0b1c2d] mt-1">{currentPlayer.growth.pah.toFixed(1)}cm</p>
                    </div>
                  </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* 선수 개인의 멘탈 레이더 차트 (팀 평균 vs 본인) */}

                      <TrendingUp className="w-5 h-5 mr-2 text-indigo-600" /> 핵심 멘탈 분석 (팀 평균 비교)
                    </h3>
                    <div className="h-[250px] w-full">
                      <ResponsiveContainer width="100%" height="100%">
                        <RadarChart cx="50%" cy="50%" outerRadius="60%" data={playerRadarData}>

                          <Radar name="팀 평균" dataKey="teamAvg" stroke="#94a3b8" fill="#94a3b8" fillOpacity={0.0} strokeDasharray="3 3" strokeWidth={1.5} />

                      </ResponsiveContainer>
                    </div>
                  </div>

                  {/* 개인 키/체중 콤보 차트 */}
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h3 className="text-base font-black text-[#0b1c2d] flex items-center mb-6">
                      <Bone className="w-5 h-5 mr-2 text-[#fbbc04]" /> 체격 성장 추이 (키 / 체중)

                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mt-6">
                  <div className="p-5 border-b border-slate-200 bg-slate-50 flex items-center">

                              <td className="px-3 py-2.5 text-right font-bold text-slate-700">{teamStats.physical.weight.toFixed(1)}</td>
                              <td className="px-3 py-2.5 text-right font-bold text-slate-700">{teamStats.physical.fat.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-right border-r border-slate-200 ${getEcwColor(teamStats.physical.ecw)}`}>{teamStats.physical.ecw.toFixed(3)}</td>
                              
                              <td className="px-3 py-2.5 text-center font-bold text-slate-700 bg-blue-50/10">{teamStats.physical.sdnn.toFixed(1)}</td>
                              <td className="px-3 py-2.5 text-center font-bold text-slate-700 bg-blue-50/10">{teamStats.physical.rmssd.toFixed(1)}</td>
                              <td className="px-3 py-2.5 text-center font-bold text-slate-700 bg-blue-50/10">{teamStats.physical.lf.toFixed(1)}</td>
                              <td className="px-3 py-2.5 text-center font-bold text-slate-700 bg-blue-50/10">{teamStats.physical.hf.toFixed(1)}</td>
                              <td className="px-3 py-2.5 text-center font-bold text-slate-700 bg-blue-50/10 border-r border-slate-200">{teamStats.physical.stress.toFixed(0)}</td>

                              <td className="px-3 py-2.5 text-center bg-purple-50/30 text-slate-400">-</td>
                              <td className="px-3 py-2.5 text-center bg-purple-50/30 text-slate-400">-</td>
                              <td className="px-3 py-2.5 text-center bg-purple-50/30 border-r border-slate-200 text-slate-400">-</td>

                              <td className="px-3 py-2.5 text-center bg-[#e30613]/5 text-slate-400">-</td>
                              <td className="px-3 py-2.5 text-center bg-[#e30613]/5 text-slate-400">-</td>
                              <td className="px-3 py-2.5 text-center bg-[#e30613]/5 border-r border-slate-200 text-slate-400">-</td>
                            </>
                          )}

                          {activeTab === 'growth' && (
                            <>
                              <td className="px-3 py-2.5 text-right bg-[#fbbc04]/10 font-bold text-[#0b1c2d]">
                                {teamStats.growth.height.toFixed(1)}<span className="text-[9px] text-slate-500 font-normal mx-0.5">cm</span> / {teamStats.physical.weight.toFixed(1)}<span className="text-[9px] text-slate-500 font-normal ml-0.5">kg</span>
                              </td>
                              <td className="px-3 py-2.5 text-center bg-[#fbbc04]/10 text-[#d97706] font-bold">
                                {Math.floor(teamStats.growth.avgBoneAge)}년 {Math.round((teamStats.growth.avgBoneAge % 1) * 12)}월
                              </td>
                              <td className="px-3 py-2.5 text-center bg-[#fbbc04]/10 text-slate-400 border-r border-slate-200">-</td>
                              <td className="px-3 py-2.5 text-right bg-[#0b1c2d]/10 font-black text-[#0b1c2d] text-sm">{teamStats.growth.pah.toFixed(1)}<span className="text-[10px] text-slate-500 font-bold ml-0.5">cm</span></td>
                              <td className="px-3 py-2.5 text-right bg-[#0b1c2d]/10 font-black text-[#e30613] text-sm">
                                +{(teamStats.growth.pah - teamStats.growth.height).toFixed(1)}<span className="text-[10px] text-[#e30613]/70 font-bold ml-0.5">cm</span>
                              </td>
                            </>
                          )}
                        </tr>
                      )}

                      {/* 개별 선수 기록 리스트 */}
                      {processedData.map((player) => (
                        <tr key={player.recordId} className="hover:bg-[#f1f5f9] transition-colors relative z-10">
                          
                          <td className="px-3 py-2.5 text-slate-500 font-mono text-[10px] sticky left-0 z-20 bg-white group-hover:bg-[#f1f5f9]">{player.playerId}</td>
                          <td 
                            className="px-3 py-2.5 font-bold text-blue-600 underline cursor-pointer sticky left-20 z-20 bg-white group-hover:bg-[#f1f5f9] border-r border-slate-100"
                            onClick={() => handlePlayerClick(player.playerId)}
                          >
                            {player.name}
                          </td>
                          <td className="px-3 py-2.5 text-slate-600 font-mono tracking-tighter">{player.birth}</td>

                          {activeTab === 'mental' && (
                            <>
                              <td className={`px-3 py-2.5 text-center bg-indigo-50/30 border-r border-slate-100 ${getScoreColor(player.mental.mgi)}`}>{player.mental.mgi.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.tension)}`}>{player.mental.tension.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.support)}`}>{player.mental.support.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.prep)}`}>{player.mental.prep.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.recovery)}`}>{player.mental.recovery.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.focus)}`}>{player.mental.focus.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-center ${getScoreColor(player.mental.stability)}`}>{player.mental.stability.toFixed(1)}</td>
                            </>
                          )}

                          {activeTab === 'physical' && (
                            <>
                              <td className="px-3 py-2.5 text-right text-slate-700">{player.weight.toFixed(1)}</td>
                              <td className="px-3 py-2.5 text-right text-slate-700">{player.physical.fat.toFixed(1)}</td>
                              <td className={`px-3 py-2.5 text-right border-r border-slate-100 ${getEcwColor(player.physical.ecw)}`}>{player.physical.ecw.toFixed(3)}</td>
                              
                              {/* HRV */}
                              <td className="px-3 py-2.5 text-center text-slate-700 bg-blue-50/5 font-mono tracking-tighter">{player.physical.hrv.sdnn.toFixed(1)}</td>
                              <td className="px-3 py-2.5 text-center text-slate-700 bg-blue-50/5 font-mono tracking-tighter">{player.physical.hrv.rmssd.toFixed(1)}</td>
                              <td className="px-3 py-2.5 text-center text-slate-700 bg-blue-50/5 font-mono tracking-tighter">{player.physical.hrv.lf.toFixed(1)}</td>
                              <td className="px-3 py-2.5 text-center text-slate-700 bg-blue-50/5 font-mono tracking-tighter">{player.physical.hrv.hf.toFixed(1)}</td>
                              <td className="px-3 py-2.5 text-center text-slate-700 bg-blue-50/5 font-mono tracking-tighter border-r border-slate-100">{player.physical.hrv.stress}</td>

                              {/* 초음파 (L/R 신호등) */}
                              <td className="px-3 py-2.5 text-center bg-purple-50/10">
                                <LRBadge left={player.physical.ultrasound.achillesL} right={player.physical.ultrasound.achillesR} />
                              </td>
                              <td className="px-3 py-2.5 text-center bg-purple-50/10">
                                <LRBadge left={player.physical.ultrasound.kneeL} right={player.physical.ultrasound.kneeR} />
                              </td>
                              <td className="px-3 py-2.5 text-center bg-purple-50/10 border-r border-slate-100">
                                <LRBadge left={player.physical.ultrasound.footL} right={player.physical.ultrasound.footR} />
                              </td>

                              {/* 일반 리스크 */}
                              <td className="px-3 py-2.5 text-center bg-[#e30613]/5"><StatusBadge status={player.physical.riskLevel.redSRisk} /></td>
                              <td className="px-3 py-2.5 text-center bg-[#e30613]/5"><StatusBadge status={player.physical.riskLevel.phyLoadRisk} /></td>
                              <td className="px-3 py-2.5 text-center bg-[#e30613]/5 border-r border-slate-100"><StatusBadge status={player.physical.riskLevel.fatigueRisk} /></td>
                            </>
                          )}

                          {activeTab === 'growth' && (
                            <>
                              <td className="px-3 py-2.5 text-right bg-[#fbbc04]/5 font-bold text-[#0b1c2d]">
                                {player.height.toFixed(1)}<span className="text-[9px] text-slate-500 font-normal mx-0.5">cm</span> / {player.weight.toFixed(1)}<span className="text-[9px] text-slate-500 font-normal ml-0.5">kg</span>
                              </td>
                              <td className="px-3 py-2.5 text-center bg-[#fbbc04]/5 text-[#d97706] font-bold">{player.growth.boneAgeYear}년 {player.growth.boneAgeMonth}월</td>
                              <td className="px-3 py-2.5 text-center bg-[#fbbc04]/5 font-bold text-slate-700 border-r border-slate-100">{player.growth.stage}</td>
                              <td className="px-3 py-2.5 text-right bg-[#0b1c2d]/5 font-black text-[#0b1c2d] text-sm">{player.growth.pah.toFixed(1)}<span className="text-[10px] text-slate-500 font-bold ml-0.5">cm</span></td>
                              <td className="px-3 py-2.5 text-right bg-[#0b1c2d]/5 font-black text-[#e30613] text-sm">
                                +{(player.growth.pah - player.height).toFixed(1)}<span className="text-[10px] text-[#e30613]/70 font-bold ml-0.5">cm</span>
                              </td>
                            </>
                          )}

                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                
                {/* 범례 푸터 (멘탈 탭에만 표시) */}
                {activeTab === 'mental' && (
                  <div className="bg-slate-50 border-t border-slate-200 px-4 py-2 flex items-center gap-4 text-[10px] text-slate-500 shrink-0 relative z-50">
                    <span className="font-bold text-slate-700">점수 범례:</span>
                    <span className="flex items-center"><div className="w-2 h-2 rounded-full bg-[#10b981] mr-1"></div> 우수 (4.5 이상)</span>
                    <span className="flex items-center"><div className="w-2 h-2 rounded-full bg-[#fbbc04] mr-1"></div> 보통 (3.0 ~ 4.4)</span>
                    <span className="flex items-center"><div className="w-2 h-2 rounded-full bg-[#e30613] mr-1"></div> 취약 (3.0 미만)</span>
                  </div>
              )}


                {/* 시스템 가이드 푸터 */}
                  <div className="mt-8 text-center text-[11px] text-slate-400 leading-relaxed pb-4 shrink-0">
                    <p className="font-bold text-slate-500 mb-1">MPS Performance Dashboard System for TEAM Coaches (ver 0.8)</p>
                    <p>본 가이드는 지도자가 선수의 심리, 피지컬, 성장 특성을 파악하고, 실제 현장에서 선수에게 적용할 수 있는 코칭 솔루션을 제공합니다.</p>
                    <p>MPS 검진은 주기화(2-3개월단위)로 검진하는 엘리트 유소년 선수 맞춤 솔루션입니다.</p>
                    <p>성장기 선수에게 결과값은 고정이 아니며, 유형, 위험도, 성장단계(뼈나이)는 바뀌면서 성장할 수 있습니다.</p>
                    <p className="mt-1 font-medium">※ 본 페이지의 결과는 의료진단, 치료를 대신하지 않습니다.</p>
                  </div>  

              </div>
            )}
          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
